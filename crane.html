<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101c24"><title>Crane + Operator | LiftCrew</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/crane.css"><link rel="canonical" href="https://www.myliftcrew.com/crane.html"><meta property="og:type" content="website"><meta property="og:site_name" content="LiftCrew"><meta property="og:title" content="Crane + Operator | LiftCrew"><meta property="og:url" content="https://www.myliftcrew.com/crane.html"><meta property="og:image" content="https://www.myliftcrew.com/hero-forklift.webp"><meta name="twitter:card" content="summary_large_image"><link rel="stylesheet" href="/src/operator-entry.css"><meta name="description" content="Book a crane and operator. Share your load, reach, site conditions, and schedule for a crane quote."></head><body class="crane-page"><header class="crane-header"><a class="brand" href="/" aria-label="LiftCrew home"><img src="/liftcrew-logo.png" alt="LiftCrew" width="1660" height="440"></a><a href="/#booking-form">Back to booking</a></header><main class="crane-main"><div class="crane-intro"><h1>Tell us about<br>your <em>lift.</em></h1><p>Crane + Operator</p></div>
<form id="crane-form" class="crane-form" novalidate>
<input type="hidden" name="service" value="Crane with operator"><input class="honeypot" name="website" autocomplete="off" tabindex="-1" aria-hidden="true">
<section class="crane-card"><h2>Your booking</h2><div class="crane-grid">
<div><label for="location">ZIP code</label><input id="location" name="location" required pattern="[0-9]{5}" maxlength="5" inputmode="numeric" autocomplete="postal-code"></div>
<div><label for="date">Date</label><input id="date" name="date" type="date" required></div>
<div><label for="durationDays">Number of days</label><select id="durationDays" name="durationDays" required><option value="">Select days</option><option value="1">1 day</option><option value="2">2 days</option><option value="3">3 days</option><option value="4">4 days</option><option value="5">5 days</option><option value="6">6 days</option><option value="7">7 days</option><option value="8">8 days</option><option value="9">9 days</option><option value="10">10 days</option><option value="11">11 days</option><option value="12">12 days</option><option value="13">13 days</option><option value="14">14 days</option><option value="15">15 days</option><option value="16">16 days</option><option value="17">17 days</option><option value="18">18 days</option><option value="19">19 days</option><option value="20">20 days</option><option value="21">21 days</option><option value="22">22 days</option><option value="23">23 days</option><option value="24">24 days</option><option value="25">25 days</option><option value="26">26 days</option><option value="27">27 days</option><option value="28">28 days</option><option value="29">29 days</option><option value="30">30 days</option></select></div>
<div class="wide"><label for="craneClass">Crane preference</label><select id="craneClass" name="craneClass"><option value="">Help me choose</option></select><p id="catalog-note" class="field-note" role="status"></p></div>
</div></section>
<div id="crane-sections"></div><noscript><p>Enable JavaScript to complete your crane request.</p></noscript>
<div class="crane-submit"><p>We’ll confirm the unit after a load-chart and site review.</p><button type="submit" class="button" disabled>Request Quote</button><p id="crane-note" role="status" aria-live="polite"></p></div>
</form>
<section id="crane-success" class="crane-card crane-success" hidden tabindex="-1"><h2>Request received.</h2><p>We’ll review your lift and follow up with availability and a quote.</p><p id="crane-reference"></p><a class="button" href="/">Back to LiftCrew</a></section>
</main><footer class="crane-footer">© <span id="year"></span> LiftCrew</footer><script type="module" src="/src/crane.js"></script></body></html>
